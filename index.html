<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Bolso</title>
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de celular, resumo do mês no topo, navegação fixa embaixo com o botão Lançar sempre à mão. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E3EBE8; --line:#D2DEDA;
  --ink:#12201C; --muted:#53655F;
  --accent:#0B6E85; --accent-ink:#FFFFFF; --accent-soft:#D6EDF2;
  --good:#17703F; --bad:#B3261E; --warn:#8F5600; --warn-soft:#FBEBCB;
  --ess:#0B6E85; --des:#C48A1C;
  color-scheme:light;
  --font-display:'Bricolage Grotesque',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#14211E; --surface2:#1D2F2A; --line:#27403A;
    --ink:#E8F1EE; --muted:#94A9A2;
    --accent:#5CC4DA; --accent-ink:#06222A; --accent-soft:#123A44;
    --good:#58C98A; --bad:#F2877F; --warn:#E8B04A; --warn-soft:#3A2B0E;
    --ess:#5CC4DA; --des:#E3A642;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#14211E; --surface2:#1D2F2A; --line:#27403A;
  --ink:#E8F1EE; --muted:#94A9A2;
  --accent:#5CC4DA; --accent-ink:#06222A; --accent-soft:#123A44;
  --good:#58C98A; --bad:#F2877F; --warn:#E8B04A; --warn-soft:#3A2B0E;
  --ess:#5CC4DA; --des:#E3A642;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 120px;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);letter-spacing:-.01em}
.logo{display:block;width:40px;height:40px;object-fit:contain}
.sync{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

.monthbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.monthbar h1{margin:0;text-align:center;font:700 22px var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}

.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.banner p{margin:0;min-width:0;flex:1 1 220px}
.banner.err{background:var(--warn-soft);color:var(--warn)}

main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font:700 17px var(--font-display);letter-spacing:-.005em}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{margin:2px 0 6px;font:700 clamp(36px,11vw,48px)/1.05 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}
.sub{margin:0;color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;margin:10px 0 0;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.hr{height:1px;background:var(--line);margin:14px 0}
.goal-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.goal-top b{font-weight:600}
.note{margin:10px 0 0;font-size:14px;color:var(--muted)}

.bar,.meter{position:relative;height:10px;border-radius:999px;background:var(--surface2)}
.bar{overflow:hidden}
.bar>i,.meter>.fill{display:block;height:100%;border-radius:999px;background:var(--ess);min-width:0}
.meter>.fill{max-width:100%}
.fill.des,.bar>i.des{background:var(--des)}
.fill.sav{background:var(--good)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;opacity:.7}

.legend{display:flex;gap:14px;margin:-4px 0 12px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--ess)}
.legend span.d::before{background:var(--des)}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.cr-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-weight:500}
.cats small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.split{display:flex;flex-direction:column;gap:16px}
.split p{margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.split small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.empty{margin:0;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{margin:14px 0 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-of-type{border-top:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:12px 0;border:0;background:none;text-align:left;align-items:center}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .c{font-size:13px;color:var(--muted)}
.item .v{grid-row:1;grid-column:2;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .tag{grid-row:2;grid-column:2;justify-self:end;font-size:12px;font-weight:600;color:var(--warn)}
.v.in{color:var(--good)} .v.sv{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}
.mini{min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px}
.mini.danger{color:var(--bad)}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;font-size:14px}

.row{display:flex;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none}
.row .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.fields{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field>span{color:var(--muted);font-weight:600}
.field input,.field select,.money{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;font-weight:500;width:100%}
.money{display:flex;align-items:center;gap:8px;padding:0 12px}
.money b{color:var(--muted);font-weight:600}
.money input{border:0;background:none;padding:0;min-height:44px;outline-offset:6px}
.help{margin:0;font-size:13px;color:var(--muted);font-weight:400}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
.tab{min-height:48px;border-radius:12px;border:0;background:none;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.add{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(5,15,12,.55)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:700 20px var(--font-display)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;background:var(--surface2);border-radius:14px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:grid;place-items:center;min-height:42px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg input:focus-visible+span{outline:3px solid var(--accent)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.err{margin:0;color:var(--bad);font-weight:600;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,8px);max-width:min(92vw,420px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img class="logo" alt="buildLab" width="40" height="40" src="icons/logo.png"><span>Meu Bolso</span></div>
    <span class="sync" id="sync">Conectando…</span>
  </header>
  <div class="monthbar">
    <button class="icon" data-act="prev" aria-label="Mês anterior">‹</button>
    <h1 id="month"></h1>
    <button class="icon" data-act="next" aria-label="Próximo mês">›</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="navin">
    <button class="tab" data-tab="resumo">Resumo</button>
    <button class="tab" data-tab="lanc">Lançamentos</button>
    <button class="tab" data-tab="reserva">Reserva</button>
    <button class="add" data-act="new">+ Lançar</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-act="close"></div>
  <form class="panel" id="form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <h2 id="sheet-title">Novo lançamento</h2>
    <div class="seg" role="radiogroup" aria-label="Tipo de lançamento">
      <label><input type="radio" name="tipo" value="out" checked><span>Gasto</span></label>
      <label><input type="radio" name="tipo" value="in"><span>Entrada</span></label>
      <label><input type="radio" name="tipo" value="save"><span>Guardar</span></label>
    </div>
    <div class="fields">
      <label class="field"><span>Valor</span><div class="money"><b>R$</b><input id="f-valor" inputmode="decimal" autocomplete="off" placeholder="0,00"></div></label>
      <label class="field" id="w-desc"><span>Descrição</span><input id="f-desc" maxlength="60" autocomplete="off" placeholder="Ex.: mercado, conta de luz"></label>
      <label class="field" id="w-cat"><span>Categoria</span><select id="f-cat"></select></label>
      <label class="field"><span>Data</span><input id="f-data" type="date"></label>
      <label class="check" id="w-pago"><input type="checkbox" id="f-pago" checked><span>Já foi pago</span></label>
      <label class="check" id="w-fixa"><input type="checkbox" id="f-fixa"><span>Repete todo mês (aluguel, internet, salário)</span></label>
    </div>
    <p class="err" id="f-err" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var fmt=function(v){return BRL.format(v||0)};
var r2=function(n){return Math.round(n*100)/100};
var pctf=function(v){return (Math.round(v*10)/10).toLocaleString('pt-BR')+'%'};
var pad=function(n){return String(n).padStart(2,'0')};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parseBRL(s){
  s=String(s||'').replace(/[R$\s]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  var n=Number(s);
  return isFinite(n)?Math.round(n*100)/100:NaN;
}
function keyOf(y,m){return y+'-'+pad(m)}
function shiftKey(k,d){var p=k.split('-').map(Number),y=p[0],m=p[1]+d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return keyOf(y,m)}
function monthLabel(k){var p=k.split('-').map(Number);var s=new Date(p[0],p[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function dayLabel(d){var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var CATS_OUT=[
  {id:'moradia',nome:'Moradia',tipo:'ess'},
  {id:'mercado',nome:'Mercado e comida',tipo:'ess'},
  {id:'contas',nome:'Contas (luz, água, internet)',tipo:'ess'},
  {id:'transporte',nome:'Transporte',tipo:'ess'},
  {id:'saude',nome:'Saúde',tipo:'ess'},
  {id:'dividas',nome:'Dívidas e parcelas',tipo:'ess'},
  {id:'educacao',nome:'Educação',tipo:'ess'},
  {id:'lazer',nome:'Lazer e delivery',tipo:'des'},
  {id:'compras',nome:'Compras',tipo:'des'},
  {id:'outros',nome:'Outros',tipo:'des'}
];
var CATS_IN=[{id:'salario',nome:'Salário'},{id:'freela',nome:'Trabalho extra'},{id:'outras',nome:'Outras entradas'}];
function catName(t,c){
  if(t==='save') return 'Reserva de emergência';
  var L=t==='in'?CATS_IN:CATS_OUT;
  for(var i=0;i<L.length;i++) if(L[i].id===c) return L[i].nome;
  return 'Outros';
}
function catTipo(c){for(var i=0;i<CATS_OUT.length;i++) if(CATS_OUT[i].id===c) return CATS_OUT[i].tipo;return 'des'}

var DEF={metaPct:20,mesesReserva:6,reserva:0,demoOff:false};
var now=new Date();
var NOWKEY=keyOf(now.getFullYear(),now.getMonth()+1);
var S={key:NOWKEY,tab:'resumo',filter:'all',months:{},cfg:Object.assign({},DEF),demo:false,store:'local',openId:null,confirmId:null,editing:null,loadFailed:false};

/* ---------- armazenamento ---------- */
var DB=null,UID=null,queues={};
function lsGet(k){try{return JSON.parse(localStorage.getItem('meubolso:'+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('meubolso:'+k,JSON.stringify(v))}catch(e){}}
function enqueue(name,fn){
  queues[name]=(queues[name]||Promise.resolve()).then(fn).catch(function(e){console.warn(e);toast('Não consegui salvar. Confira a conexão e tente de novo.')});
  return queues[name];
}
async function readDoc(name){
  if(DB&&UID){var s=await DB.doc('data/users/'+UID+'/'+name).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}
  return lsGet(name);
}
function writeDoc(name,data){
  var snap=JSON.parse(JSON.stringify(data));
  return enqueue(name,async function(){
    if(DB&&UID) await DB.doc('data/users/'+UID+'/'+name).set(snap); else lsSet(name,snap);
  });
}
function persist(k){writeDoc('mes-'+k,{tx:S.months[k]||[]})}
function saveCfg(){if(S.demo)return;writeDoc('config',S.cfg)}
async function ensureMonths(k){
  var ks=[k,shiftKey(k,-1),shiftKey(k,-2)].filter(function(x){return !(x in S.months)});
  await Promise.all(ks.map(async function(x){var d=await readDoc('mes-'+x);S.months[x]=d&&Array.isArray(d.tx)?d.tx:[]}));
}
async function connect(){
  var c=window.claude;
  if(c&&c.use){
    try{
      var r=await Promise.all([c.use('user'),c.use('db')]);
      if(r[0]&&r[1]){var id=await r[0].id();if(id){DB=r[1];UID=id;S.store='db'}}
    }catch(e){}
  }
  if(S.store!=='db') S.store='local';
}

/* ---------- exemplo ---------- */
function seedDemo(){
  var k=S.key,n=0;
  var mk=function(t,v,c,desc,d,pago,fixa){return {id:'demo'+(n++),t:t,v:v,c:c,desc:desc,d:k+'-'+pad(d),pago:pago!==false,fixa:!!fixa}};
  S.months[k]=[
    mk('in',3200,'salario','Salário',5,true,true),
    mk('in',650,'freela','Trabalho extra',14),
    mk('out',900,'moradia','Aluguel',6,true,true),
    mk('out',620,'mercado','Mercado do mês',9),
    mk('out',120,'contas','Internet',10,true,true),
    mk('out',210,'contas','Energia',12,false,true),
    mk('out',180,'transporte','Combustível',11),
    mk('out',140,'lazer','Pizza no fim de semana',15),
    mk('out',260,'saude','Farmácia',16,false),
    mk('save',400,'reserva','Reserva de emergência',7)
  ];
  S.cfg=Object.assign({},DEF,{reserva:3200});
  S.demo=true;
}
function leaveDemo(){
  if(!S.demo) return;
  S.demo=false;
  var keep={metaPct:S.cfg.metaPct,mesesReserva:S.cfg.mesesReserva};
  S.cfg=Object.assign({},DEF,keep,{demoOff:true});
  S.months={};
  [S.key,shiftKey(S.key,-1),shiftKey(S.key,-2)].forEach(function(k){S.months[k]=[]});
  saveCfg();
}
async function loadAll(){
  try{
    var cfg=await readDoc('config');
    var saved=S.months;
    S.months={};
    S.cfg=Object.assign({},DEF,cfg||{});
    await ensureMonths(S.key);
    var any=Object.keys(S.months).some(function(k){return S.months[k].length});
    S.demo=false;
    if(!any&&!S.cfg.demoOff&&!cfg){seedDemo()}
  }catch(e){
    console.warn(e);
    S.loadFailed=true;
  }
}

/* ---------- cálculos ---------- */
function sums(tx){
  var o={inn:0,out:0,pend:0,save:0,ess:0,des:0,by:{}};
  tx.forEach(function(t){
    if(t.t==='in') o.inn+=t.v;
    else if(t.t==='save') o.save+=t.v;
    else{
      o.out+=t.v;
      if(!t.pago) o.pend+=t.v;
      o.by[t.c]=(o.by[t.c]||0)+t.v;
      if(catTipo(t.c)==='ess') o.ess+=t.v; else o.des+=t.v;
    }
  });
  ['inn','out','pend','save','ess','des'].forEach(function(k){o[k]=r2(o[k])});
  return o;
}
function avgEss(){
  var ks=[S.key,shiftKey(S.key,-1),shiftKey(S.key,-2)];
  var vals=ks.map(function(k){return sums(S.months[k]||[]).ess}).filter(function(v){return v>0});
  return vals.length?r2(vals.reduce(function(a,b){return a+b},0)/vals.length):0;
}
function fixedCandidates(){
  var prev=S.months[shiftKey(S.key,-1)]||[],cur=S.months[S.key]||[];
  return prev.filter(function(p){
    return p.fixa&&p.t!=='save'&&!cur.some(function(c){return c.t===p.t&&c.c===p.c&&c.desc===p.desc})
  });
}

/* ---------- telas ---------- */
function meterRow(label,val,inn,ref,cls,txt){
  var p=inn>0?val/inn*100:0;
  return '<div><p><span>'+label+'</span><span class="num">'+pctf(p)+'</span></p>'+
    '<div class="meter"><span class="fill '+cls+'" style="width:'+Math.min(100,p)+'%"></span><i class="tick" style="left:'+ref+'%"></i></div>'+
    '<small>'+fmt(val)+' · '+txt+' '+ref+'% da renda</small></div>';
}
function viewResumo(){
  var tx=S.months[S.key]||[],m=sums(tx);
  var sobra=r2(m.inn-m.out),meta=r2(m.inn*S.cfg.metaPct/100),livre=r2(m.inn-m.out-m.save);
  var insight;
  if(!tx.length) insight='Nada lançado neste mês ainda. Toque em + Lançar para começar.';
  else if(sobra<0) insight='Os gastos passaram das entradas em '+fmt(-sobra)+'.';
  else if(meta>0&&m.save>=meta) insight='Meta de guardar do mês batida.';
  else if(meta>0&&livre>0) insight='Dá para guardar mais '+fmt(Math.min(livre,r2(meta-m.save)))+' e bater a meta.';
  else if(meta>0) insight='Não sobrou o bastante para a meta. Faltam '+fmt(r2(meta-m.save))+'.';
  else insight='';
  var hero='<section class="card"><p class="eyebrow">Sobra do mês</p>'+
    '<p class="big '+(sobra<0?'neg':'pos')+'">'+fmt(sobra)+'</p>'+
    '<p class="sub">Entrou <b class="num">'+fmt(m.inn)+'</b> · Saiu <b class="num">'+fmt(m.out)+'</b></p>'+
    (m.pend>0?'<p class="chip warn">Ainda a pagar: '+fmt(m.pend)+'</p>':'');
  if(meta>0){
    var pr=Math.min(100,m.save/meta*100);
    hero+='<div class="hr"></div><div class="goal-top"><span>Guardado no mês</span><span class="num"><b>'+fmt(m.save)+'</b> de '+fmt(meta)+' ('+S.cfg.metaPct+'% da renda)</span></div>'+
      '<div class="meter"><span class="fill sav" style="width:'+pr+'%"></span></div>';
  }
  if(insight) hero+='<p class="note">'+esc(insight)+'</p>';
  hero+='</section>';

  var cats=Object.keys(m.by).map(function(c){return [c,m.by[c]]}).sort(function(a,b){return b[1]-a[1]});
  var max=cats.length?cats[0][1]:0;
  var catHtml='<section class="card"><h2>Para onde foi o dinheiro</h2>';
  if(cats.length){
    catHtml+='<div class="legend"><span>Essencial</span><span class="d">Desejo</span></div><ul class="cats">'+
      cats.map(function(e){
        return '<li><div class="cr-top"><span>'+esc(catName('out',e[0]))+'</span><span class="num">'+fmt(e[1])+'</span></div>'+
          '<div class="bar"><i class="'+catTipo(e[0])+'" style="width:'+(max?e[1]/max*100:0)+'%"></i></div>'+
          '<small>'+pctf(e[1]/m.out*100)+' dos gastos</small></li>';
      }).join('')+'</ul>';
  }else catHtml+='<p class="empty">Nenhum gasto lançado neste mês.</p>';
  catHtml+='</section>';

  var split='<section class="card"><h2>Divisão da renda</h2>';
  if(m.inn>0){
    split+='<div class="split">'+
      meterRow('Essenciais',m.ess,m.inn,50,'','referência')+
      meterRow('Desejos',m.des,m.inn,30,'des','referência')+
      meterRow('Guardado',m.save,m.inn,20,'sav','referência')+'</div>'+
      '<p class="note">A marca preta é a regra 50/30/20: até 50% para o essencial, até 30% para desejos e pelo menos 20% para guardar.</p>';
  }else split+='<p class="empty">Lance as entradas do mês para ver como a renda se divide.</p>';
  split+='</section>';
  return hero+catHtml+split;
}

function viewLanc(){
  var tx=S.months[S.key]||[],f=S.filter;
  var list=tx.filter(function(t){
    return f==='all'||(f==='in'&&t.t==='in')||(f==='out'&&t.t==='out')||(f==='pend'&&t.t==='out'&&!t.pago)||(f==='save'&&t.t==='save');
  }).sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)});
  var FIL=[['all','Todos'],['in','Entradas'],['out','Gastos'],['pend','A pagar'],['save','Guardado']];
  var h='<div class="chips" role="group" aria-label="Filtrar lançamentos">'+FIL.map(function(x){
    return '<button class="fchip" data-filter="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';
  }).join('')+'</div>';
  var cand=S.demo?[]:fixedCandidates();
  if(cand.length) h+='<div class="banner"><p>'+cand.length+(cand.length===1?' conta fixa do mês anterior ainda não entrou neste mês.':' contas fixas do mês anterior ainda não entraram neste mês.')+'</p><button class="mini" data-act="copyfixed">Trazer para cá</button></div>';
  if(!list.length){
    h+='<section class="card"><p class="empty">'+(tx.length?'Nada neste filtro.':'Nenhum lançamento neste mês.')+'</p></section>';
    return h;
  }
  var days=[],byDay={};
  list.forEach(function(t){if(!byDay[t.d]){byDay[t.d]=[];days.push(t.d)}byDay[t.d].push(t)});
  h+='<section class="card">'+days.map(function(d){
    return '<h3 class="day">'+esc(dayLabel(d))+'</h3><ul class="list">'+byDay[d].map(rowHtml).join('')+'</ul>';
  }).join('')+'</section>';
  return h;
}
function rowHtml(t){
  var sign=t.t==='in'?'+ ':t.t==='out'?'− ':'→ ';
  var cls=t.t==='in'?'in':t.t==='save'?'sv':'';
  var open=S.openId===t.id;
  var h='<li><button class="item" data-row="'+esc(t.id)+'" aria-expanded="'+open+'">'+
    '<span class="t">'+esc(t.desc)+'</span><span class="v '+cls+'">'+sign+fmt(t.v)+'</span>'+
    '<span class="c">'+esc(catName(t.t,t.c))+(t.fixa?' · fixa':'')+'</span>'+
    (t.t==='out'&&!t.pago?'<span class="tag">a pagar</span>':'')+'</button>';
  if(open){
    if(S.confirmId===t.id){
      h+='<div class="acts"><div class="conf"><span>Excluir este lançamento?</span><button class="mini danger" data-act="delyes" data-id="'+esc(t.id)+'">Excluir</button><button class="mini" data-act="delno">Manter</button></div></div>';
    }else{
      h+='<div class="acts">'+(t.t==='out'?'<button class="mini" data-act="pago" data-id="'+esc(t.id)+'">'+(t.pago?'Voltar para a pagar':'Marcar como pago')+'</button>':'')+
        '<button class="mini" data-act="edit" data-id="'+esc(t.id)+'">Editar</button>'+
        '<button class="mini danger" data-act="del" data-id="'+esc(t.id)+'">Excluir</button></div>';
    }
  }
  return h+'</li>';
}

function viewReserva(){
  var avg=avgEss(),target=r2(avg*S.cfg.mesesReserva),res=S.cfg.reserva,falta=Math.max(0,r2(target-res));
  var prog=target>0?Math.min(100,res/target*100):0,cover=avg>0?res/avg:0;
  var m=sums(S.months[S.key]||[]);
  var rate=r2(m.inn*S.cfg.metaPct/100)||m.save;
  var proj;
  if(target<=0) proj='Lance seus gastos essenciais para calcular a meta da reserva.';
  else if(falta===0) proj='Reserva completa para '+S.cfg.mesesReserva+' meses de gastos essenciais.';
  else if(rate>0){
    var n=Math.ceil(falta/rate);
    proj='Guardando '+fmt(rate)+' por mês, você chega lá em '+n+(n===1?' mês':' meses')+', por volta de '+monthLabel(shiftKey(NOWKEY,n))+'.';
  }else proj='Defina uma meta de guardar ou registre um depósito para ver a previsão.';
  var dec=function(x){return esc(String(x).replace('.',','))};
  return '<section class="card"><p class="eyebrow">Reserva de emergência</p>'+
    '<p class="big">'+fmt(res)+'</p>'+
    '<p class="sub">'+(avg>0?'Cobre <b class="num">'+(Math.round(cover*10)/10).toLocaleString('pt-BR')+'</b> de '+S.cfg.mesesReserva+' meses de gastos essenciais':'Ainda sem gastos essenciais para comparar')+'</p>'+
    '<div class="hr"></div>'+
    '<div class="goal-top"><span>Meta da reserva</span><span class="num"><b>'+fmt(target)+'</b></span></div>'+
    '<div class="meter"><span class="fill sav" style="width:'+prog+'%"></span></div>'+
    '<p class="note">'+(target>0&&falta>0?'Faltam '+fmt(falta)+'. ':'')+esc(proj)+'</p>'+
    '<div class="stack"><button class="btn primary" data-act="newsave">Guardar agora</button></div></section>'+
    '<section class="card"><h2>Suas metas</h2><div class="fields">'+
    '<label class="field"><span>Guardar por mês (% da renda)</span><input data-cfg="metaPct" inputmode="decimal" value="'+dec(S.cfg.metaPct)+'"></label>'+
    '<label class="field"><span>Reserva para quantos meses</span><input data-cfg="mesesReserva" inputmode="numeric" value="'+dec(S.cfg.mesesReserva)+'"></label>'+
    '<label class="field"><span>Quanto já tem guardado (R$)</span><input data-cfg="reserva" inputmode="decimal" value="'+dec(S.cfg.reserva)+'"></label>'+
    '<p class="help">A meta da reserva usa a média dos gastos essenciais dos últimos meses lançados'+(avg>0?' ('+fmt(avg)+' por mês)':'')+'. Valores guardados pelo botão Guardar somam aqui sozinhos.</p>'+
    '</div></section>'+
    '<section class="card"><h2>Backup dos dados</h2>'+
    '<p class="help">Seus lançamentos ficam só neste aparelho. Baixe um backup de vez em quando e guarde no e-mail ou na nuvem. Restaurar um backup substitui os dados atuais.</p>'+
    '<div class="stack"><button class="btn" data-act="export">Baixar backup</button>'+
    '<button class="btn" data-act="import">Restaurar backup</button>'+
    '<input type="file" id="importf" accept="application/json,.json" hidden></div></section>';
}

function render(){
  $('#month').textContent=monthLabel(S.key);
  var labels={wait:'Conectando…',db:'Salvo na sua conta',local:'Salvo neste aparelho'};
  $('#sync').textContent=S.loadFailed?'Sem conexão':labels[S.store];
  var b=$('#banner');
  if(S.loadFailed){b.hidden=false;b.className='banner err';b.innerHTML='<p>Não consegui carregar seus dados. Recarregue a página antes de lançar, para não sobrescrever nada.</p>'}
  else if(S.demo){b.hidden=false;b.className='banner';b.innerHTML='<p>Exemplo com valores fictícios. Ao salvar o seu primeiro lançamento, o exemplo some.</p><button class="mini" data-act="zero">Começar do zero</button>'}
  else b.hidden=true;
  document.querySelectorAll('[data-tab]').forEach(function(x){x.setAttribute('aria-current',x.dataset.tab===S.tab?'page':'false')});
  $('#view').innerHTML=S.tab==='resumo'?viewResumo():S.tab==='lanc'?viewLanc():viewReserva();
}

/* ---------- ações ---------- */
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},3400)}
function blocked(){
  if(S.loadFailed){toast('Seus dados não carregaram. Recarregue a página.');return true}
  if(S.demo){toast('Estes valores são de exemplo. Toque em Começar do zero.');return true}
  return false;
}
function findTx(id){for(var k in S.months){var a=S.months[k];for(var i=0;i<a.length;i++) if(a[i].id===id) return {k:k,i:i,t:a[i]}}return null}

async function upsert(tx){
  if(S.loadFailed){toast('Seus dados não carregaram. Recarregue a página antes de lançar.');return false}
  leaveDemo();
  var k=tx.d.slice(0,7);
  try{await ensureMonths(k)}catch(e){toast('Não consegui abrir esse mês. Tente de novo.');return false}
  var old=null;
  Object.keys(S.months).forEach(function(mk){
    var a=S.months[mk],i=a.findIndex(function(x){return x.id===tx.id});
    if(i>=0){old=a[i];a.splice(i,1);if(mk!==k) persist(mk)}
  });
  S.months[k].push(tx);persist(k);
  var delta=r2((tx.t==='save'?tx.v:0)-(old&&old.t==='save'?old.v:0));
  if(delta){S.cfg.reserva=Math.max(0,r2(S.cfg.reserva+delta));saveCfg()}
  return true;
}
function removeTx(id){
  if(blocked()) return;
  var f=findTx(id);if(!f) return;
  S.months[f.k].splice(f.i,1);persist(f.k);
  if(f.t.t==='save'){S.cfg.reserva=Math.max(0,r2(S.cfg.reserva-f.t.v));saveCfg()}
  S.openId=null;S.confirmId=null;render();toast('Lançamento excluído.');
}
function togglePago(id){
  if(blocked()) return;
  var f=findTx(id);if(!f) return;
  f.t.pago=!f.t.pago;persist(f.k);render();
}
async function copyFixed(){
  if(blocked()) return;
  var cand=fixedCandidates();
  cand.forEach(function(p){
    var day=Math.min(Number(p.d.slice(8,10)),new Date(Number(S.key.slice(0,4)),Number(S.key.slice(5,7)),0).getDate());
    S.months[S.key].push({id:newId(),t:p.t,v:p.v,c:p.c,desc:p.desc,d:S.key+'-'+pad(day),pago:p.t==='in'?true:false,fixa:true});
  });
  persist(S.key);render();
  toast(cand.length+(cand.length===1?' conta trazida.':' contas trazidas.')+' Confira os valores.');
}

/* ---------- formulário ---------- */
var form=$('#form');
function tipoAtual(){return form.elements.tipo.value}
function fillCats(sel){
  var t=tipoAtual(),L=t==='in'?CATS_IN:CATS_OUT;
  $('#f-cat').innerHTML=L.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.nome)+'</option>'}).join('');
}
function syncForm(){
  var t=tipoAtual();
  $('#w-cat').hidden=t==='save';
  $('#w-pago').hidden=t!=='out';
  $('#w-fixa').hidden=t==='save';
  $('#f-desc').placeholder=t==='in'?'Ex.: salário, trabalho extra':t==='save'?'Ex.: depósito do mês':'Ex.: mercado, conta de luz';
}
function showErr(msg){var e=$('#f-err');e.textContent=msg;e.hidden=!msg}
function openSheet(o){
  o=o||{};
  if(S.loadFailed){toast('Seus dados não carregaram. Recarregue a página.');return}
  var tx=o.id?findTx(o.id):null;
  if(o.id&&S.demo){toast('Estes valores são de exemplo. Toque em Começar do zero.');return}
  S.editing=tx?tx.t.id:null;
  var t=tx?tx.t.t:(o.tipo||'out');
  form.elements.tipo.value=t;
  fillCats(tx?tx.t.c:undefined);
  $('#sheet-title').textContent=tx?'Editar lançamento':t==='save'?'Guardar dinheiro':'Novo lançamento';
  $('#f-valor').value=tx?String(tx.t.v).replace('.',','):'';
  $('#f-desc').value=tx?tx.t.desc:'';
  var base=S.key===NOWKEY?todayStr():S.key+'-01';
  $('#f-data').value=tx?tx.t.d:base;
  $('#f-pago').checked=tx?!!tx.t.pago:true;
  $('#f-fixa').checked=tx?!!tx.t.fixa:false;
  showErr('');syncForm();
  $('#sheet').hidden=false;
  setTimeout(function(){$('#f-valor').focus()},30);
}
function closeSheet(){$('#sheet').hidden=true;S.editing=null}
form.addEventListener('change',function(e){if(e.target.name==='tipo'){fillCats();syncForm()}});
form.addEventListener('submit',async function(e){
  e.preventDefault();
  var t=tipoAtual(),v=parseBRL($('#f-valor').value),d=$('#f-data').value;
  if(!(v>0)){showErr('Digite um valor maior que zero. Exemplo: 1.250,90');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){showErr('Escolha uma data.');return}
  var c=t==='save'?'reserva':$('#f-cat').value;
  var tx={id:S.editing||newId(),t:t,v:v,c:c,desc:$('#f-desc').value.trim()||catName(t,c),d:d,
    pago:t==='out'?$('#f-pago').checked:true,fixa:t==='save'?false:$('#f-fixa').checked};
  var ok=await upsert(tx);
  if(!ok) return;
  closeSheet();
  var k=d.slice(0,7);
  if(k!==S.key){S.key=k;try{await ensureMonths(k)}catch(err){}}
  S.openId=null;S.confirmId=null;render();
  toast(t==='save'?'Guardado na reserva.':'Lançamento salvo.');
});

/* ---------- eventos ---------- */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act],[data-tab],[data-filter],[data-row]');
  if(!el) return;
  if(el.dataset.tab){S.tab=el.dataset.tab;S.openId=null;S.confirmId=null;render();window.scrollTo(0,0);return}
  if(el.dataset.filter){S.filter=el.dataset.filter;S.openId=null;render();return}
  if(el.dataset.row){var id=el.dataset.row;S.openId=S.openId===id?null:id;S.confirmId=null;render();return}
  var a=el.dataset.act,id2=el.dataset.id;
  if(a==='prev'||a==='next'){
    var k=shiftKey(S.key,a==='next'?1:-1);
    try{await ensureMonths(k);S.key=k;S.openId=null;S.confirmId=null;render()}catch(err){toast('Não consegui abrir esse mês.')}
  }
  else if(a==='new') openSheet({tipo:'out'});
  else if(a==='newsave') openSheet({tipo:'save'});
  else if(a==='close') closeSheet();
  else if(a==='edit') openSheet({id:id2});
  else if(a==='del'){S.confirmId=id2;render()}
  else if(a==='delno'){S.confirmId=null;render()}
  else if(a==='delyes') removeTx(id2);
  else if(a==='pago') togglePago(id2);
  else if(a==='copyfixed') copyFixed();
  else if(a==='zero'){leaveDemo();render()}
  else if(a==='export') exportBackup();
  else if(a==='import') $('#importf').click();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet()});
document.addEventListener('change',function(e){
  var el=e.target.closest&&e.target.closest('[data-cfg]');
  if(!el) return;
  if(S.loadFailed){toast('Seus dados não carregaram. Recarregue a página.');render();return}
  var k=el.dataset.cfg,n=parseBRL(el.value);
  if(!isFinite(n)||n<0){toast('Valor inválido.');render();return}
  if(k==='metaPct') n=Math.min(100,n);
  if(k==='mesesReserva') n=Math.min(60,Math.max(1,Math.round(n)));
  S.cfg[k]=n;saveCfg();render();
});

/* ---------- backup ---------- */
function exportBackup(){
  var o={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('meubolso:')===0) o[k]=localStorage.getItem(k)}}catch(e){}
  var blob=new Blob([JSON.stringify({app:'meu-bolso',v:1,data:o})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-bolso-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
  toast('Backup baixado.');
}
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='importf') return;
  var f=e.target.files&&e.target.files[0];if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result);
      if(!j||j.app!=='meu-bolso'||!j.data) throw new Error('formato');
      var keys=Object.keys(j.data).filter(function(k){return k.indexOf('meubolso:')===0});
      if(!keys.length) throw new Error('vazio');
      for(var i=localStorage.length-1;i>=0;i--){var k0=localStorage.key(i);if(k0&&k0.indexOf('meubolso:')===0) localStorage.removeItem(k0)}
      keys.forEach(function(k){localStorage.setItem(k,j.data[k])});
      toast('Backup restaurado.');setTimeout(function(){location.reload()},700);
    }catch(err){toast('Esse arquivo não é um backup do Meu Bolso.')}
  };
  rd.readAsText(f);e.target.value='';
});

/* ---------- início ---------- */
seedDemo();
render();
(async function(){
  await connect();
  await loadAll();
  render();
})();
})();
</script>
